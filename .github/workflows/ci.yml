name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned package manager and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build:selfhost
      - name: Isolated six-session HTTP and persistence check
        run: pnpm run test:load
      - name: Install recovery test browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser interruption and recovery checks
        run: pnpm run test:recovery
      - run: pnpm run build
