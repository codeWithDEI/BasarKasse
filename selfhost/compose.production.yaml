name: basarkasse-production
services:
  basarkasse-production:
    image: basarkasse-production:${BASAR_REVISION:?Set the reviewed production revision}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /basarkasse
        BASAR_REVISION: ${BASAR_REVISION:-unrecorded}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BASAR_MODE: production
      BASAR_DEVICE_BYPASS_UNTIL: ${BASAR_DEVICE_BYPASS_UNTIL:-}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BASAR_TEAM_PIN_KEY: ${BASAR_TEAM_PIN_KEY:?Set the stable production PIN key}
      BASAR_DATABASE: /data/basarkasse.sqlite
      BASAR_OPS_STATE: /ops-state
      BASAR_REVISION: ${BASAR_REVISION:-unrecorded}
      BASAR_PUBLIC_ORIGIN: ${BASAR_PUBLIC_ORIGIN:?Set the public HTTPS origin}
      NEXT_PUBLIC_BASE_PATH: /basarkasse
      NEXT_TELEMETRY_DISABLED: 1
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - production-data:/data
      - ${BASAR_OPS_STATE_DIRECTORY:-/srv/basarkasse-production-ops/state}:/ops-state:ro
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/basarkasse/api/basar?view=access').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  production-data:
networks:
  portal:
    external: true
    name: roetgesportal_backend
